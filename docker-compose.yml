services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactionreader
      POSTGRES_PASSWORD: transactionreader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactionreader -d transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
